# Windows 版 EmuStation のインストーラーを作る（Windows の環境でビルドする）
# 結果は Actions の実行の「Artifacts」から EmuStation-setup をダウンロードする
name: Windows app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: テスト（共通モジュールと Windows 版）
        working-directory: android
        run: ./gradlew --no-daemon :core:test :desktop:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: android/desktop/build/screenshots/

  installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: アプリの組み立て（Java の実行環境ごと）
        working-directory: android
        run: ./gradlew.bat --no-daemon :desktop:createDistributable
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: インストーラーを作る
        shell: pwsh
        working-directory: android/desktop/packaging
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.0 "/DAppDir=$PWD\..\build\compose\binaries\main\app\EmuStation" emusync.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EmuStation-setup
          path: android/desktop/packaging/output/*.exe
