# emusync（エミュのセーブ同期）の location。
# このファイルを /etc/nginx/snippets/emusync.conf に置き、Nextcloud を載せている既存の
# server { listen 443 ssl; ... } ブロックの中に次の1行を足して読み込む（sites-available には置かない）：
#     include snippets/emusync.conf;
# ^~ を付けて、Nextcloud 用の正規表現 location（\.php など）に横取りされないようにする。
location ^~ /emusync/ {
    proxy_pass http://127.0.0.1:8765/;   # 末尾の / で /emusync/ を外して転送
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 256m;           # 1ファイルの上限（サーバーの EMUSYNC_MAX_BYTES と同じ）
    proxy_request_buffering off;
    proxy_read_timeout 300s;

    # LAN・VPN（WireGuard）・サーバー自身からだけ受け付ける。範囲は自宅のネットワークに合わせる
    allow 127.0.0.0/8;           # サーバー上での curl の確認用
    allow 192.168.50.0/24;       # 自宅の LAN
    allow 10.6.0.0/24;           # WireGuard のクライアントに割り当てる範囲
    deny all;
}
