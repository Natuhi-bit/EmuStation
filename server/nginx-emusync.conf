# Nextcloud を載せている既存の server { listen 443 ssl; ... } ブロックの中に追記する。
# ^~ を付けて、Nextcloud 用の正規表現 location（\.php など）に横取りされないようにする。
location ^~ /emusync/ {
    proxy_pass http://127.0.0.1:8765/;   # 末尾の / で /emusync/ を外して転送
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 256m;           # Wii の NAND など大きめのファイル用
    proxy_request_buffering off;
    proxy_read_timeout 300s;

    # LAN と VPN（Tailscale は 100.64.0.0/10）からだけ受け付ける
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    deny all;
}
